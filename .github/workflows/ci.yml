name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proto-lint:
    name: Proto Contracts (Buf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint proto schemas
        run: buf lint

  net-go:
    name: L1 Network & Supervisor (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/net-go
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/net-go/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: services/net-go/go.*
      - name: Go vet
        run: go vet ./...
      - name: Go race tests
        run: go test -race -v ./...
      - name: Build and verify CLI
        run: |
          go build -o /tmp/slipgate ./cmd/slipgate
          /tmp/slipgate --version

  core-zig:
    name: L2 Core Engine (Zig)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-zig
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Run Zig unit tests
        run: zig build test --summary all
      - name: Build and verify CLI
        run: |
          zig build -Doptimize=ReleaseSafe
          ./zig-out/bin/slipgate-core --version
          ./zig-out/bin/slipgate-guestd --version

  bun-workspace:
    name: L3/L4 Contracts, BFF & Vue Console (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install workspace dependencies
        run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi
      - name: Typecheck TS & Vue workspaces
        run: bun run typecheck
      - name: Run Bun tests
        run: bun run test
      - name: Build Vue console
        run: bun run --cwd apps/web-vue build
      - name: Compile BFF standalone binary
        run: |
          bun build --compile services/bff-ts/src/index.ts --outfile /tmp/slipgate-bff
          /tmp/slipgate-bff --version

  docker-smoke:
    name: Single-Service Container Smoke Test
    needs: [proto-lint, net-go, core-zig, bun-workspace]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build unified single-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: slipgate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify embedded plane binaries
        run: |
          docker run --rm slipgate:ci --version
          docker run --rm --entrypoint /usr/local/bin/slipgate-core slipgate:ci --version
          docker run --rm --entrypoint /usr/local/share/slipgate/guest/slipgate-guestd slipgate:ci --version
          docker run --rm --entrypoint /usr/local/bin/slipgate-bff slipgate:ci --version
      - name: Verify single-service 3-plane boot & dual-plane routing
        run: |
          docker run -d --name sg-smoke -p 18080:8080 slipgate:ci
          trap 'docker logs sg-smoke || true; docker rm -f sg-smoke >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/readyz >/tmp/readyz.json 2>/dev/null; then
              cat /tmp/readyz.json
              break
            fi
            sleep 0.5
          done

          curl -fsS http://127.0.0.1:18080/readyz | grep -q '"ready":true'
          curl -fsS http://127.0.0.1:18080/api/v1/system/architecture | grep -q 'slipgate-bff'

          # Verify admin endpoints reject unauthenticated requests, then complete first-run setup
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/v1/admin/vms/slots)" = "401" ]
          SETUP_JSON=$(curl -fsS -X POST http://127.0.0.1:18080/api/v1/setup/initialize \
            -H 'Content-Type: application/json' \
            -d '{"siteName":"Slipgate CI","adminEmail":"ci@slipgate.dev","adminPassword":"CiPassword123!"}')
          TOKEN=$(printf '%s' "$SETUP_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin)["accessToken"])')
          USER_ID=$(printf '%s' "$SETUP_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin)["user"]["id"])')

          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18080/api/v1/admin/vms/overview | grep -q '"local-node"'
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18080/api/v1/admin/vms/overview | grep -q '"oneSlotOneEgress":true'
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18080/api/v1/admin/system/update | grep -q 'dreamforSh/Slipgate'
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18080/api/v1/admin/clash/overview | grep -q '"ready":true'
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18080/api/v1/admin/clash/overview | grep -q '"mode":"embedded"'
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18080/api/v1/admin/tls-profiles | grep -q 'chrome-131'
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18080/api/v1/admin/tls-profiles | grep -q 'claude-bun-21'
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18080/api/v1/admin/tls-profiles | grep -q 'codex-rustls-01'
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18080/api/v1/admin/tls-profiles | grep -q 'antigravity-electron-15'
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18080/api/v1/admin/tls-profiles | grep -q '"auto"'
          BAD_TLS_CODE=$(curl -s -o /tmp/bad_tls.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"name":"CI Bad KeyShare","curves":[23],"keyShareGroups":[29],"extensions":[0,10,16,43,51]}' \
            http://127.0.0.1:18080/api/v1/admin/tls-profiles)
          [ "$BAD_TLS_CODE" = "400" ]
          grep -q 'TLS_PROFILE_KEY_SHARE_NOT_IN_CURVES' /tmp/bad_tls.json
          BAD_VM_CODE=$(curl -s -o /tmp/bad_vm.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"accountId":"ci-unbound-account"}' \
            http://127.0.0.1:18080/api/v1/admin/vms/slots)
          [ "$BAD_VM_CODE" = "503" ] || [ "$BAD_VM_CODE" = "400" ] || [ "$BAD_VM_CODE" = "409" ]
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"name":"CI Inline Sub","sourceKind":"inline","sourceUrl":"proxies:\n  - name: Tokyo-CI\n    type: socks5\n    server: 198.51.100.10\n    port: 1080","autoSync":true}' \
            http://127.0.0.1:18080/api/v1/admin/clash/subscriptions | grep -q '"activeListeners":1'
          # DataPlane Mainline 1 E2E: unauthenticated 401 -> wallet credit + mock account + composite route -> unary/SSE/transcode -> settlement -> risk gate
          UNAUTH_DP_CODE=$(curl -s -D /tmp/dp_unauth.headers -o /tmp/dp_unauth.json -w '%{http_code}' \
            -X POST http://127.0.0.1:18080/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"claude-sonnet-4-5","messages":[{"role":"user","content":"hi"}]}')
          [ "$UNAUTH_DP_CODE" = "401" ]
          grep -qi 'X-Slipgate-Plane: dataplane-direct' /tmp/dp_unauth.headers

          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"amountUsd":"10.00","reason":"ci_smoke_credit"}' \
            "http://127.0.0.1:18080/api/v1/admin/users/$USER_ID/credit" | grep -q '"10000000000"'

          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"name":"ci-mock-anthropic","groupId":"grp_default","platform":"anthropic","executionMode":"direct_api","authKind":"oauth","subscriptionTier":"ultra","credentialSecret":"mock://ok"}' \
            http://127.0.0.1:18080/api/v1/admin/accounts | grep -q '"tierMultiplier":20'

          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"name":"ci-mock-codex","groupId":"grp_default","platform":"codex","executionMode":"direct_api","authKind":"oauth","subscriptionTier":"pro_25x","credentialSecret":"mock://ok"}' \
            http://127.0.0.1:18080/api/v1/admin/accounts | grep -q '"tierMultiplier":25'

          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"name":"ci-mock-antigravity","groupId":"grp_default","platform":"antigravity","executionMode":"direct_api","authKind":"vm_cli_seed","credentialSecret":"mock://ok"}' \
            http://127.0.0.1:18080/api/v1/admin/accounts | grep -q '"antigravity"'

          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"groupId":"grp_default","publicModel":"sonnet-ci","matchType":"exact","targetPlatform":"anthropic","upstreamModel":"claude-sonnet-4-5","priority":10}' \
            http://127.0.0.1:18080/api/v1/admin/routes | grep -q '"sonnet-ci"'

          KEY_JSON=$(curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"name":"ci-smoke-key","groupId":"grp_default"}' \
            http://127.0.0.1:18080/api/v1/user/api-keys)
          API_KEY=$(printf '%s' "$KEY_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin)["plaintextKey"])')

          curl -fsS -H "Authorization: Bearer $API_KEY" http://127.0.0.1:18080/v1/models | grep -q 'claude-sonnet-4-5'
          curl -fsS -H "Authorization: Bearer $API_KEY" http://127.0.0.1:18080/v1/models | grep -q 'gpt-5-codex'
          curl -fsS -H "Authorization: Bearer $API_KEY" http://127.0.0.1:18080/v1/models | grep -q 'antigravity/claude-sonnet-4-5'

          curl -fsS -D /tmp/dp.headers -X POST http://127.0.0.1:18080/v1/chat/completions \
            -H "Authorization: Bearer $API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"model":"sonnet-ci","stream":false,"messages":[{"role":"user","content":"Hello Slipgate"}]}' >/tmp/dp_unary.json
          grep -qi 'X-Slipgate-Plane: dataplane-direct' /tmp/dp.headers
          grep -qi 'X-Slipgate-Subscription-Tier: ultra' /tmp/dp.headers
          grep -q 'Slipgate verified response from claude-sonnet-4-5' /tmp/dp_unary.json

          curl -fsS -N -X POST http://127.0.0.1:18080/v1/chat/completions \
            -H "Authorization: Bearer $API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"model":"claude-sonnet-4-5","stream":true,"messages":[{"role":"user","content":"Stream test"}]}' >/tmp/dp_stream.txt
          grep -q 'chat.completion.chunk' /tmp/dp_stream.txt
          grep -q '\[DONE\]' /tmp/dp_stream.txt

          curl -fsS -X POST "http://127.0.0.1:18080/v1beta/models/claude-sonnet-4-5:generateContent?key=$API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"contents":[{"role":"user","parts":[{"text":"Cross-protocol Gemini to Anthropic"}]}]}' | grep -q '"candidates"'

          curl -fsS -X POST http://127.0.0.1:18080/v1/chat/completions \
            -H "Authorization: Bearer $API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"model":"gpt-5-codex","stream":false,"messages":[{"role":"user","content":"Hello Codex"}]}' | grep -q 'Slipgate verified response from gpt-5-codex'

          curl -fsS -X POST http://127.0.0.1:18080/v1/chat/completions \
            -H "Authorization: Bearer $API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"model":"antigravity/claude-sonnet-4-5","stream":false,"messages":[{"role":"user","content":"Hello Antigravity"}]}' | grep -q 'Slipgate verified response'

          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18080/api/v1/user/usage | grep -q '"sonnet-ci"'
          WALLET_JSON=$(curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18080/api/v1/user/wallet)
          printf '%s' "$WALLET_JSON" | python3 -c 'import sys,json; bal=int(json.load(sys.stdin)["wallet"]["balanceNanoUsd"]); assert 0 < bal < 10_000_000_000, bal'

          RISK_CODE=$(curl -s -o /tmp/dp_risk.json -w '%{http_code}' -X POST http://127.0.0.1:18080/v1/chat/completions \
            -H "Authorization: Bearer $API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"model":"claude-sonnet-4-5","messages":[{"role":"user","content":"__slipgate_risk_probe__"}]}')
          [ "$RISK_CODE" = "403" ]
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18080/api/v1/admin/risk/events | grep -q 'prompt_distillation_signature'

  publish-dev:
    name: Publish Rolling Dev Container & Deployable Bundles
    needs: [docker-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Derive dev build metadata
        id: buildmeta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BASE_VER="$(tr -d '\r\n' < VERSION)"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "dev_version=${BASE_VER}-dev.${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract dev image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=sha-

      - name: Build and push multi-arch dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SLIPGATE_VERSION=${{ steps.buildmeta.outputs.dev_version }}
            SLIPGATE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-go@v6
        with:
          go-version-file: services/net-go/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: services/net-go/go.*

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build cross-platform deployable dev bundles
        run: |
          chmod +x scripts/package-release.sh deploy/install.sh
          bash scripts/package-release.sh dev "${{ steps.buildmeta.outputs.dev_version }}" "${GITHUB_SHA}" /tmp/dev-dist

      - name: Publish rolling dev-latest GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f dev-latest "${GITHUB_SHA}"
          git push -f origin refs/tags/dev-latest
          if gh release view dev-latest >/dev/null 2>&1; then
            gh release edit dev-latest --prerelease \
              --title "Slipgate Dev Rolling (${{ steps.buildmeta.outputs.short_sha }})" \
              --notes-file /tmp/dev-dist/RELEASE_NOTES.md
            gh release upload dev-latest /tmp/dev-dist/* --clobber
          else
            gh release create dev-latest /tmp/dev-dist/* --prerelease \
              --title "Slipgate Dev Rolling (${{ steps.buildmeta.outputs.short_sha }})" \
              --notes-file /tmp/dev-dist/RELEASE_NOTES.md
          fi
