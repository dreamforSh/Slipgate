name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proto-lint:
    name: Proto Contracts (Buf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint proto schemas
        run: buf lint

  net-go:
    name: L1 Network & Supervisor (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/net-go
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/net-go/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: services/net-go/go.*
      - name: Go vet
        run: go vet ./...
      - name: Go race tests
        run: go test -race -v ./...
      - name: Build and verify CLI
        run: |
          go build -o /tmp/slipgate ./cmd/slipgate
          /tmp/slipgate --version

  core-zig:
    name: L2 Core Engine (Zig)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-zig
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Run Zig unit tests
        run: zig build test --summary all
      - name: Build and verify CLI
        run: |
          zig build -Doptimize=ReleaseSafe
          ./zig-out/bin/slipgate-core --version
          ./zig-out/bin/slipgate-guestd --version

  bun-workspace:
    name: L3/L4 Contracts, BFF & Vue Console (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install workspace dependencies
        run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi
      - name: Typecheck TS & Vue workspaces
        run: bun run typecheck
      - name: Run Bun tests
        run: bun run test
      - name: Build Vue console
        run: bun run --cwd apps/web-vue build
      - name: Compile BFF standalone binary
        run: |
          bun build --compile services/bff-ts/src/index.ts --outfile /tmp/slipgate-bff
          /tmp/slipgate-bff --version

  docker-smoke:
    name: Single-Service Container Smoke Test
    needs: [proto-lint, net-go, core-zig, bun-workspace]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build unified single-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: slipgate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify embedded plane binaries
        run: |
          docker run --rm slipgate:ci --version
          docker run --rm --entrypoint /usr/local/bin/slipgate-core slipgate:ci --version
          docker run --rm --entrypoint /usr/local/share/slipgate/guest/slipgate-guestd slipgate:ci --version
          docker run --rm --entrypoint /usr/local/bin/slipgate-bff slipgate:ci --version
      - name: Verify single-service 3-plane boot & dual-plane routing
        run: |
          docker run -d --name sg-smoke -p 18080:8080 slipgate:ci
          trap 'docker logs sg-smoke || true; docker rm -f sg-smoke >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/readyz >/tmp/readyz.json 2>/dev/null; then
              cat /tmp/readyz.json
              break
            fi
            sleep 0.5
          done

          curl -fsS http://127.0.0.1:18080/readyz | grep -q '"ready":true'
          curl -fsS http://127.0.0.1:18080/api/v1/system/architecture | grep -q 'slipgate-bff'

          # Verify admin endpoints reject unauthenticated requests, then complete first-run setup
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/v1/admin/vms/slots)" = "401" ]
          SETUP_JSON=$(curl -fsS -X POST http://127.0.0.1:18080/api/v1/setup/initialize \
            -H 'Content-Type: application/json' \
            -d '{"siteName":"Slipgate CI","adminEmail":"ci@slipgate.dev","adminPassword":"CiPassword123!"}')
          TOKEN=$(printf '%s' "$SETUP_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin)["accessToken"])')

          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18080/api/v1/admin/vms/slots | grep -q 'kvm_qemu'
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18080/api/v1/admin/system/update | grep -q 'dreamforSh/Slipgate'
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18080/api/v1/admin/clash/overview | grep -q '"ready":true'
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18080/api/v1/admin/clash/overview | grep -q '"mode":"embedded"'
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18080/api/v1/admin/tls-profiles | grep -q 'chrome-131'
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"name":"CI Inline Sub","sourceKind":"inline","sourceUrl":"proxies:\n  - name: Tokyo-CI\n    type: socks5\n    server: 198.51.100.10\n    port: 1080","autoSync":true}' \
            http://127.0.0.1:18080/api/v1/admin/clash/subscriptions | grep -q '"activeListeners":1'
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"name":"ci-smoke-key","groupId":"grp_default"}' \
            http://127.0.0.1:18080/api/v1/user/api-keys | grep -q 'sk-sg-'

          curl -fsS -D /tmp/dp.headers -X POST http://127.0.0.1:18080/v1/chat/completions | grep -q 'slipgate-core'
          grep -qi 'X-Slipgate-Plane: dataplane-direct' /tmp/dp.headers

  publish-dev:
    name: Publish Rolling Dev Container & Deployable Bundles
    needs: [docker-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Derive dev build metadata
        id: buildmeta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BASE_VER="$(tr -d '\r\n' < VERSION)"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "dev_version=${BASE_VER}-dev.${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract dev image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=sha-

      - name: Build and push multi-arch dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SLIPGATE_VERSION=${{ steps.buildmeta.outputs.dev_version }}
            SLIPGATE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-go@v6
        with:
          go-version-file: services/net-go/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: services/net-go/go.*

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build cross-platform deployable dev bundles
        run: |
          chmod +x scripts/package-release.sh deploy/install.sh
          bash scripts/package-release.sh dev "${{ steps.buildmeta.outputs.dev_version }}" "${GITHUB_SHA}" /tmp/dev-dist

      - name: Publish rolling dev-latest GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f dev-latest "${GITHUB_SHA}"
          git push -f origin refs/tags/dev-latest
          if gh release view dev-latest >/dev/null 2>&1; then
            gh release edit dev-latest --prerelease \
              --title "Slipgate Dev Rolling (${{ steps.buildmeta.outputs.short_sha }})" \
              --notes-file /tmp/dev-dist/RELEASE_NOTES.md
            gh release upload dev-latest /tmp/dev-dist/* --clobber
          else
            gh release create dev-latest /tmp/dev-dist/* --prerelease \
              --title "Slipgate Dev Rolling (${{ steps.buildmeta.outputs.short_sha }})" \
              --notes-file /tmp/dev-dist/RELEASE_NOTES.md
          fi
