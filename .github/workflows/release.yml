name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: Build & Push Single-Service Multi-Arch Image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validate VERSION matches tag
        id: validate
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          FILE_VERSION="$(tr -d '\r\n' < VERSION)"
          if [[ "$FILE_VERSION" != "$VERSION" ]]; then
            echo "VERSION ($FILE_VERSION) does not match tag ($VERSION)" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.validate.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.validate.outputs.tag }}
            type=raw,value=latest

      - name: Build and push multi-arch container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SLIPGATE_VERSION=${{ steps.validate.outputs.version }}
            SLIPGATE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-bundles:
    name: Build & Publish Deployable Release Archives
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.docker.outputs.tag }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: services/net-go/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: services/net-go/go.*

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Package cross-platform release bundles
        run: |
          chmod +x scripts/package-release.sh deploy/install.sh
          bash scripts/package-release.sh "${{ needs.docker.outputs.tag }}" "${{ needs.docker.outputs.version }}" "${GITHUB_SHA}" /tmp/release-dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.docker.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Slipgate ${TAG}" --notes-file /tmp/release-dist/RELEASE_NOTES.md
            gh release upload "$TAG" /tmp/release-dist/* --clobber
          else
            gh release create "$TAG" /tmp/release-dist/* --title "Slipgate ${TAG}" --notes-file /tmp/release-dist/RELEASE_NOTES.md
          fi
