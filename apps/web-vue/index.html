<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Slipgate 控制台</title>
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round'%3E%3Cstyle%3Esvg%7Bcolor:%230f766e%7D%40media (prefers-color-scheme:dark)%7Bsvg%7Bcolor:%232dd4bf%7D%7D%3C/style%3E%3Crect x='1' y='1' width='30' height='30' rx='9' fill='currentColor' fill-opacity='0.08' stroke-opacity='0.45' stroke-width='1.5'/%3E%3Cpath d='M6.5 23.5H10v-9a6 6 0 0 1 12 0v9h3.5' stroke-width='2.4'/%3E%3Cpath d='m14.75 16.5 2.75 2.75-2.75 2.75' stroke-width='2.4'/%3E%3C/svg%3E"
  />
  <script>
    // Apply the saved theme before first paint to avoid a light/dark flash.
    (function () {
      try {
        var mode = localStorage.getItem("slipgate_theme") || "system";
        var dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
