services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-slipgate}
      POSTGRES_USER: ${POSTGRES_USER:-slipgate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slipgate}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../migrations/core/0001_init_core.sql:/docker-entrypoint-initdb.d/01_core.sql:ro
      - ../migrations/net/0001_init_net.sql:/docker-entrypoint-initdb.d/02_net.sql:ro
      - ../migrations/commerce/0001_init_commerce.sql:/docker-entrypoint-initdb.d/03_commerce.sql:ro
      - ../migrations/core/0002_vm_quota_and_risk.sql:/docker-entrypoint-initdb.d/04_core_vm.sql:ro
      - ../migrations/net/0002_vm_slots_and_cluster.sql:/docker-entrypoint-initdb.d/05_net_vm.sql:ro
      - ../migrations/commerce/0002_portal_settings.sql:/docker-entrypoint-initdb.d/06_commerce_settings.sql:ro
      - ../migrations/core/0003_console_metadata.sql:/docker-entrypoint-initdb.d/07_core_console.sql:ro
      - ../migrations/net/0003_clash_subscription_metadata.sql:/docker-entrypoint-initdb.d/08_net_clash_meta.sql:ro
      - ../migrations/net/0004_tls_wire_params_and_vm_seeds.sql:/docker-entrypoint-initdb.d/09_net_tls_vm.sql:ro
      - ../migrations/net/0005_vm_runtime_profile.sql:/docker-entrypoint-initdb.d/10_net_vm_runtime.sql:ro
      - ../migrations/core/0004_account_subscription_tier.sql:/docker-entrypoint-initdb.d/11_core_sub_tier.sql:ro
      - ../migrations/core/0005_group_account_management.sql:/docker-entrypoint-initdb.d/12_core_group_account_mgmt.sql:ro
      - ../migrations/core/0006_account_lifecycle.sql:/docker-entrypoint-initdb.d/13_core_account_lifecycle.sql:ro
      - ../migrations/net/0006_cluster_node_host_key.sql:/docker-entrypoint-initdb.d/14_net_cluster_node_host_key.sql:ro
      - ../migrations/commerce/0003_operations.sql:/docker-entrypoint-initdb.d/15_commerce_operations.sql:ro
      - ../migrations/core/0007_group_caps_and_spend.sql:/docker-entrypoint-initdb.d/16_core_group_caps_and_spend.sql:ro
      - ../migrations/commerce/0004_payments.sql:/docker-entrypoint-initdb.d/17_commerce_payments.sql:ro
      - ../migrations/core/0008_api_key_limits.sql:/docker-entrypoint-initdb.d/18_core_api_key_limits.sql:ro
      - ../migrations/commerce/0005_email.sql:/docker-entrypoint-initdb.d/19_commerce_email.sql:ro
      - ../migrations/core/0009_settlement_integrity.sql:/docker-entrypoint-initdb.d/20_core_settlement_integrity.sql:ro
      - ../migrations/commerce/0006_payments_integrity.sql:/docker-entrypoint-initdb.d/21_commerce_payments_integrity.sql:ro
      - ../migrations/core/0010_session_security.sql:/docker-entrypoint-initdb.d/22_core_session_security.sql:ro
      - ../migrations/commerce/0007_ops_integrity.sql:/docker-entrypoint-initdb.d/23_commerce_ops_integrity.sql:ro
      - ../migrations/core/0011_user_limits.sql:/docker-entrypoint-initdb.d/24_core_user_limits.sql:ro
      - ../migrations/commerce/0008_auth_guards.sql:/docker-entrypoint-initdb.d/25_commerce_auth_guards.sql:ro
      - ../migrations/commerce/0009_payment_providers.sql:/docker-entrypoint-initdb.d/26_commerce_payment_providers.sql:ro
      - ../migrations/core/0012_pricing_engine.sql:/docker-entrypoint-initdb.d/27_core_pricing_engine.sql:ro
      - ../migrations/commerce/0010_announcement_targeting.sql:/docker-entrypoint-initdb.d/28_commerce_announcement_targeting.sql:ro
      - ../migrations/commerce/0011_db_backups.sql:/docker-entrypoint-initdb.d/29_commerce_db_backups.sql:ro
      - ../migrations/core/0013_platform_quotas.sql:/docker-entrypoint-initdb.d/30_core_platform_quotas.sql:ro
      - ../migrations/commerce/0012_passkeys.sql:/docker-entrypoint-initdb.d/31_commerce_passkeys.sql:ro
      - ../migrations/commerce/0013_payment_settings.sql:/docker-entrypoint-initdb.d/32_commerce_payment_settings.sql:ro
      - ../migrations/core/0014_request_errors.sql:/docker-entrypoint-initdb.d/33_core_request_errors.sql:ro
      - ../migrations/core/0015_usage_rollups.sql:/docker-entrypoint-initdb.d/34_core_usage_rollups.sql:ro
      - ../migrations/commerce/0014_site_pages.sql:/docker-entrypoint-initdb.d/35_commerce_site_pages.sql:ro
      - ../migrations/commerce/0015_oauth_extras.sql:/docker-entrypoint-initdb.d/36_commerce_oauth_extras.sql:ro
      - ../migrations/commerce/0016_user_attributes.sql:/docker-entrypoint-initdb.d/37_commerce_user_attributes.sql:ro
      - ../migrations/commerce/0017_affiliate.sql:/docker-entrypoint-initdb.d/38_commerce_affiliate.sql:ro
      - ../migrations/commerce/0018_redeem_extras.sql:/docker-entrypoint-initdb.d/39_commerce_redeem_extras.sql:ro
      - ../migrations/commerce/0019_alerts.sql:/docker-entrypoint-initdb.d/40_commerce_alerts.sql:ro
      - ../migrations/commerce/0020_channel_monitors.sql:/docker-entrypoint-initdb.d/41_commerce_channel_monitors.sql:ro
      - ../migrations/core/0016_moderation.sql:/docker-entrypoint-initdb.d/42_core_moderation.sql:ro
      - ../migrations/commerce/0021_system_logs.sql:/docker-entrypoint-initdb.d/43_commerce_system_logs.sql:ro
      - ../migrations/core/0017_media_billing.sql:/docker-entrypoint-initdb.d/44_core_media_billing.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slipgate} -d ${POSTGRES_DB:-slipgate}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  slipgate:
    image: ghcr.io/dreamforsh/slipgate:${SLIPGATE_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 90s
    ports:
      - "${SLIPGATE_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      SLIPGATE_LISTEN_ADDR: ":8080"
      SLIPGATE_CORE_IPC: "127.0.0.1:19081"
      SLIPGATE_BFF_ADDR: "127.0.0.1:19082"
      SLIPGATE_MODE: "${SLIPGATE_MODE:-release}"
      SLIPGATE_DEV_SYNC_MODE: "${SLIPGATE_DEV_SYNC_MODE:-release}"
      SLIPGATE_DEV_SYNC_INTERVAL_SEC: "${SLIPGATE_DEV_SYNC_INTERVAL_SEC:-60}"
      SLIPGATE_UPDATE_REPO: "${SLIPGATE_UPDATE_REPO:-dreamforSh/Slipgate}"
      SLIPGATE_UPDATE_BRANCH: "${SLIPGATE_UPDATE_BRANCH:-main}"
      SLIPGATE_GITHUB_TOKEN: "${SLIPGATE_GITHUB_TOKEN:-}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-slipgate}:${POSTGRES_PASSWORD:-slipgate}@postgres:5432/${POSTGRES_DB:-slipgate}?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
    volumes:
      - slipgate_hotupdate:/var/run/slipgate/hotupdate
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  slipgate_hotupdate:
